"$schema" = "https://starship.rs/config-schema.json"

add_newline = false
command_timeout = 500
scan_timeout = 10
format = """
$directory$git_branch${custom.git_dirty}$git_status$fill$cmd_duration
$character"""
palette = "vesper"

[palettes.vesper]
foreground = "#FFFFFF"
muted = "#A1A1AA"
subtle = "#6B6B78"
accent = "#FFC799"
red = "#FF8080"

[fill]
symbol = " "
style = ""

[directory]
format = "[$path]($style)[$read_only]($read_only_style) "
style = "fg:foreground"
truncation_length = 3
truncation_symbol = "…/"
read_only = " [ro]"
read_only_style = "fg:red"

[git_branch]
format = "[on $branch]($style) "
style = "fg:accent"
truncation_length = 24
truncation_symbol = "…"

[custom.git_dirty]
command = "printf '•'"
when = "git rev-parse --is-inside-work-tree >/dev/null 2>&1 && test -n \"$(git status --porcelain 2>/dev/null)\""
format = "[$output]($style) "
style = "fg:muted"
require_repo = true

[git_status]
format = "[$ahead_behind]($style)"
style = "fg:subtle"
ahead = "⇡${count} "
behind = "⇣${count} "
diverged = "⇕⇡${ahead_count}⇣${behind_count} "
conflicted = ""
deleted = ""
modified = ""
renamed = ""
staged = ""
stashed = ""
untracked = ""
up_to_date = ""

[cmd_duration]
min_time = 1000
format = "[$duration]($style)"
style = "fg:subtle"

[character]
success_symbol = "[›](fg:accent) "
error_symbol = "[›](fg:red) "
vimcmd_symbol = "[‹](fg:accent) "
